<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="410" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="45" y="55" fill="#0284c7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">FIGURE 04 &bull; TERRAIN INSPECTION &amp; PROFILING</text>
  <text x="45" y="80" fill="#0f172a" font-family="Inter, sans-serif" font-size="18" font-weight="800">Two-Point Raycaster Cross-Section &amp; Point Elevation Inspector</text>

  <g transform="translate(45, 105)">
    <rect width="710" height="230" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    
    <!-- Grid lines -->
    <line x1="50" y1="40" x2="660" y2="40" stroke="#e2e8f0" stroke-dasharray="4,4"/>
    <line x1="50" y1="90" x2="660" y2="90" stroke="#e2e8f0" stroke-dasharray="4,4"/>
    <line x1="50" y1="140" x2="660" y2="140" stroke="#e2e8f0" stroke-dasharray="4,4"/>
    <line x1="50" y1="190" x2="660" y2="190" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Elevation Curve -->
    <path d="M 50 190 L 120 185 L 140 183 L 145 90 L 220 90 L 225 183 L 300 180 L 350 120 L 400 140 L 420 180 L 520 178 L 525 60 L 610 60 L 615 185 L 660 188" 
          fill="rgba(37, 99, 235, 0.08)" stroke="#2563eb" stroke-width="2.5"/>

    <!-- Labels -->
    <text x="15" y="45" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">25m</text>
    <text x="15" y="95" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">15m</text>
    <text x="15" y="145" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">5m</text>
    <text x="15" y="195" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">0m</text>

    <text x="180" y="75" fill="#ef4444" font-family="Inter, sans-serif" font-size="10" font-weight="700">Commercial Building (~15.2m)</text>
    <circle cx="185" cy="90" r="4" fill="#ef4444"/>

    <text x="360" y="105" fill="#22c55e" font-family="Inter, sans-serif" font-size="10" font-weight="700">Tree Canopy (~8.4m)</text>
    <circle cx="375" cy="130" r="4" fill="#22c55e"/>

    <text x="540" y="45" fill="#0284c7" font-family="Inter, sans-serif" font-size="10" font-weight="700">High-Rise Tower (~24.1m)</text>
    <circle cx="570" cy="60" r="4" fill="#0284c7"/>

    <text x="50" y="212" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Point A (0m)</text>
    <text x="610" y="212" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Point B (280m)</text>
  </g>

  <g transform="translate(45, 355)">
    <rect width="710" height="55" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="15" y="25" fill="#1e40af" font-family="Inter, sans-serif" font-size="11" font-weight="700">Interactive Validation Tool:</text>
    <text x="15" y="43" fill="#334155" font-family="Inter, sans-serif" font-size="11">Click any two points on the 3D terrain canvas to generate instant 2D elevation cross-sections &bull; Supports slope assessment and building height verification.</text>
  </g>
</svg>