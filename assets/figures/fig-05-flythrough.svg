<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="410" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="45" y="55" fill="#2563eb" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">FIGURE 05 &bull; 3D TERRAIN FLYTHROUGH</text>
  <text x="45" y="80" fill="#0f172a" font-family="Inter, sans-serif" font-size="18" font-weight="800">Browser-Based Real-Time Textured Mesh Navigation (Three.js)</text>

  <g transform="translate(45, 105)">
    <!-- Viewport Container -->
    <rect width="470" height="240" rx="8" fill="#0f172a"/>
    <!-- Wireframe Terrain Grid with Texture -->
    <path d="M 20 200 L 235 70 L 450 200 L 235 230 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <path d="M 120 140 L 235 70 L 340 140 L 235 190 Z" fill="#0f766e" stroke="#2dd4bf" stroke-width="1" opacity="0.6"/>
    <!-- Building Extrusions -->
    <rect x="180" y="90" width="40" height="50" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
    <polygon points="180,90 200,75 240,75 220,90" fill="#0284c7"/>
    <polygon points="220,90 240,75 240,125 220,140" fill="#0369a1"/>

    <!-- HUD Overlay -->
    <rect x="15" y="15" width="160" height="36" rx="4" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.2)"/>
    <text x="25" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">CAM: FLYTHROUGH (FPS)</text>
    <text x="25" y="44" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">ALT: 142m &bull; SPEED: 12 m/s</text>
  </g>

  <!-- Right Panel: Controls & Features -->
  <g transform="translate(535, 105)">
    <rect width="220" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="15" y="25" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="700">Navigation Modes</text>
    
    <g transform="translate(15, 40)">
      <rect width="190" height="40" rx="4" fill="#ffffff" stroke="#2563eb"/>
      <text x="10" y="20" fill="#2563eb" font-family="Inter, sans-serif" font-size="11" font-weight="700">First-Person Flythrough</text>
      <text x="10" y="33" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">WASD + Mouse PointerLock</text>
      
      <rect y="48" width="190" height="40" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="68" fill="#0f172a" font-family="Inter, sans-serif" font-size="11" font-weight="600">Top-Down Orbit View</text>
      <text x="10" y="81" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">360&deg; Spatial Overview</text>

      <rect y="96" width="190" height="40" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="116" fill="#0f172a" font-family="Inter, sans-serif" font-size="11" font-weight="600">Height Exaggeration</text>
      <text x="10" y="129" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">1.0x to 5.0x Scale Slider</text>

      <rect y="144" width="190" height="40" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="164" fill="#7c3aed" font-family="Inter, sans-serif" font-size="11" font-weight="600">Confidence Overlay</text>
      <text x="10" y="177" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">RGB &harr; Uncertainty Swap</text>
    </g>
  </g>

  <g transform="translate(45, 365)">
    <rect width="710" height="50" rx="6" fill="#f1f5f9"/>
    <text x="15" y="30" fill="#334155" font-family="Inter, sans-serif" font-size="11">
      <tspan font-weight="700">Mesh Reconstruction:</tspan> 16-bit heightmap decoding via Float32 displacement on GPU PlaneGeometry &bull; Standalone browser deployment with zero external plugin overhead.
    </text>
  </g>
</svg>