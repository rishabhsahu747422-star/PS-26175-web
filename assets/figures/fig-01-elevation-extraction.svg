<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="depthGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="25%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="75%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgLight)"/>
  <rect x="20" y="20" width="760" height="410" rx="12" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Header -->
  <text x="45" y="55" fill="#2563eb" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">FIGURE 01 &bull; STAGE 1: ELEVATION EXTRACTION</text>
  <text x="45" y="80" fill="#0f172a" font-family="Inter, sans-serif" font-size="18" font-weight="800">Depth Anything V2 Monocular Backbone &amp; GAMUS Fine-Tuning</text>

  <!-- Left Panel: Optical RGB Input -->
  <g transform="translate(45, 105)">
    <rect width="210" height="240" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="15" y="25" fill="#1e40af" font-family="Inter, sans-serif" font-size="12" font-weight="700">01. Optical Input (RGB)</text>
    <!-- Simulated Top-down Satellite Image -->
    <rect x="15" y="40" width="180" height="150" rx="6" fill="#cbd5e1"/>
    <!-- Buildings & Roads -->
    <path d="M 15 110 L 195 110" stroke="#94a3b8" stroke-width="8"/>
    <path d="M 105 40 L 105 190" stroke="#94a3b8" stroke-width="8"/>
    <rect x="30" y="55" width="50" height="40" fill="#64748b" rx="2"/>
    <rect x="125" y="55" width="55" height="40" fill="#475569" rx="2"/>
    <rect x="30" y="130" width="55" height="45" fill="#334155" rx="2"/>
    <circle cx="150" cy="150" r="22" fill="#15803d"/>
    <text x="15" y="215" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">512x512 &bull; GSD ~0.3m</text>
  </g>

  <!-- Middle Arrow & Model Box -->
  <g transform="translate(275, 180)">
    <rect width="220" height="90" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="110" y="30" fill="#2563eb" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Depth Anything V2</text>
    <text x="110" y="50" fill="#64748b" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">ViT Encoder + DPT Decoder</text>
    <text x="110" y="70" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">Fine-Tuned on GAMUS (11.5k)</text>
    
    <path d="M -15 45 L -2 45" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 222 45 L 235 45" stroke="#2563eb" stroke-width="2"/>
  </g>

  <!-- Right Panel: Relative Depth Map -->
  <g transform="translate(525, 105)">
    <rect width="230" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="15" y="25" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="700">02. Relative Depth (nDSM)</text>
    
    <!-- Heatmap representation -->
    <rect x="15" y="40" width="200" height="150" rx="6" fill="#1e293b"/>
    <rect x="30" y="55" width="50" height="40" fill="#facc15" rx="2"/>
    <rect x="125" y="55" width="55" height="40" fill="#fb923c" rx="2"/>
    <rect x="30" y="130" width="55" height="45" fill="#f87171" rx="2"/>
    <circle cx="150" cy="150" r="22" fill="#22c55e"/>
    
    <!-- Colorbar -->
    <rect x="15" y="200" width="200" height="10" rx="3" fill="url(#depthGrad)"/>
    <text x="15" y="224" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Ground (0.0)</text>
    <text x="175" y="224" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Peak (1.0)</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(45, 370)">
    <rect width="710" height="45" rx="6" fill="#f1f5f9"/>
    <text x="15" y="27" fill="#334155" font-family="Inter, sans-serif" font-size="11">
      <tspan font-weight="700">Key Takeaway:</tspan> Resolves nadir perspective gap without stereo pairs. Fine-tuned with scale-invariant loss + multi-scale gradient loss.
    </text>
  </g>
</svg>