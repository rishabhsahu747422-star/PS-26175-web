<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#f8fafc"/>
  <rect x="20" y="20" width="760" height="410" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="45" y="55" fill="#7c3aed" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">FIGURE 03 &bull; INNOVATION 2: UNCERTAINTY &amp; CONFIDENCE</text>
  <text x="45" y="80" fill="#0f172a" font-family="Inter, sans-serif" font-size="18" font-weight="800">Monte Carlo Dropout &amp; Test-Time Augmentation Variance Map</text>

  <!-- Split View: Height vs Uncertainty -->
  <g transform="translate(45, 105)">
    <rect width="335" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="15" y="25" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="700">Estimated Elevation Surface</text>
    <rect x="15" y="40" width="305" height="150" rx="6" fill="#3b82f6" opacity="0.15"/>
    <!-- Mesh profile lines -->
    <path d="M 25 150 Q 100 60 175 140 T 310 90" stroke="#2563eb" stroke-width="2.5" fill="none"/>
    <text x="15" y="215" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Mean Prediction &mu;(x, y) across N passes</text>
  </g>

  <g transform="translate(420, 105)">
    <rect width="335" height="240" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="15" y="25" fill="#7c3aed" font-family="Inter, sans-serif" font-size="12" font-weight="700">Uncertainty Map &sigma;&sup2;(x, y)</text>
    <rect x="15" y="40" width="305" height="150" rx="6" fill="#1e1b4b"/>
    <!-- Low variance ground vs high variance tree canopy/edges -->
    <rect x="35" y="60" width="80" height="70" fill="#a855f7" opacity="0.4" rx="4"/>
    <rect x="150" y="55" width="90" height="80" fill="#ef4444" opacity="0.85" rx="4"/>
    <text x="155" y="100" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">High Variance (Shadow/Canopy)</text>
    <text x="38" y="100" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9">Low Variance</text>
    
    <text x="15" y="215" fill="#6b21a8" font-family="'JetBrains Mono', monospace" font-size="10">Toggleable 3D viewer heatmap overlay</text>
  </g>

  <!-- Bottom Explanation -->
  <g transform="translate(45, 365)">
    <rect width="710" height="50" rx="6" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="15" y="30" fill="#6b21a8" font-family="Inter, sans-serif" font-size="11">
      <tspan font-weight="700">Operational Value:</tspan> Flags occluded shadows and dense vegetation where predictions are less certain &bull; Critical for disaster management risk analysis.
    </text>
  </g>
</svg>