<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="100%" stop-color="#091222"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)"/>

  <!-- Grid overlay -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Title Header -->
  <text x="40" y="45" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2">VESSEL EXTRACTION &amp; CFAR TARGET DETECTION</text>
  <text x="40" y="68" fill="#ffffff" font-family="Inter, sans-serif" font-weight="700" font-size="17">Constant False Alarm Rate (CFAR) Maritime Ship Detection in SAR Swath</text>

  <!-- CFAR Sliding Window Concept Box -->
  <g transform="translate(60, 110)">
    <!-- Outer Training Window -->
    <rect x="0" y="0" width="220" height="220" rx="6" fill="rgba(15, 23, 42, 0.6)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="10" y="20" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">Training Window (Sea Clutter)</text>

    <!-- Guard Window -->
    <rect x="40" y="40" width="140" height="140" rx="4" fill="rgba(2, 132, 199, 0.15)" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="50" y="60" fill="#0ea5e9" font-family="'JetBrains Mono', monospace" font-size="9">Guard Cells</text>

    <!-- Target Cell Under Test (CUT) -->
    <rect x="80" y="80" width="60" height="60" rx="3" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="88" y="115" fill="#020617" font-family="Inter, sans-serif" font-size="11" font-weight="800">CUT</text>
    
    <text x="0" y="250" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="12" font-weight="600">Adaptive Threshold Condition:</text>
    <text x="0" y="272" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">T = &alpha; &middot; P_clutter + P_bias</text>
    <text x="0" y="292" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Detect if P_target &gt; T with P_fa = 10^-6</text>
  </g>

  <!-- Simulated SAR Image with Detected Targets -->
  <g transform="translate(360, 110)">
    <rect width="380" height="320" rx="8" fill="#0b1324" stroke="rgba(255, 255, 255, 0.1)"/>
    
    <!-- Shipping Channel Track Lines -->
    <line x1="30" y1="280" x2="350" y2="50" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" stroke-dasharray="6,6"/>

    <!-- Vessel Target 1 (Detected) -->
    <circle cx="160" cy="180" r="4" fill="#ffffff"/>
    <rect x="145" y="165" width="30" height="30" rx="2" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="185" y="175" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">TARGET #V-01</text>
    <text x="185" y="190" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10">Length: ~185m | RCS: 48 dBm²</text>
    <text x="185" y="205" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">AIS Correlated: MMSI 413289000</text>

    <!-- Vessel Target 2 (Detected) -->
    <circle cx="280" cy="95" r="3.5" fill="#ffffff"/>
    <rect x="268" y="83" width="24" height="24" rx="2" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="210" y="65" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">TARGET #V-02</text>
    <text x="210" y="80" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10">Length: ~95m</text>

    <!-- Vessel Target 3 (Near Slick - Under Analysis) -->
    <circle cx="80" cy="245" r="4" fill="#ffffff"/>
    <rect x="65" y="230" width="30" height="30" rx="2" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="105" y="240" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">TARGET #V-03 (SUSPECT)</text>
    <text x="105" y="255" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="10">Proximity to Slick Head: 1.8 nm</text>
    <text x="105" y="270" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9">Course: 042° | SOG: 14.2 kn</text>
  </g>

  <!-- Bottom Legend -->
  <g transform="translate(60, 455)" font-family="Inter, sans-serif" font-size="11">
    <rect x="0" y="0" width="14" height="14" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="22" y="11" fill="#cbd5e1">Confirmed Vessel Detection</text>

    <rect x="230" y="0" width="14" height="14" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="252" y="11" fill="#cbd5e1">Proximity Correlated Candidate</text>
  </g>
</svg>
