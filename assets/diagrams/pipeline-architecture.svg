<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="lightShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1000" height="480" fill="url(#bgGrad)"/>
  <g stroke="rgba(37, 99, 235, 0.05)" stroke-width="1">
    <line x1="0" y1="80" x2="1000" y2="80"/><line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="0" y1="240" x2="1000" y2="240"/><line x1="0" y1="320" x2="1000" y2="320"/>
    <line x1="0" y1="400" x2="1000" y2="400"/><line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/><line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="800" y1="0" x2="800" y2="480"/>
  </g>

  <text x="40" y="45" fill="#2563eb" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2" font-weight="700">DEPTHWIZARD SYSTEM PIPELINE</text>
  <text x="40" y="68" fill="#0f172a" font-family="Inter, sans-serif" font-weight="800" font-size="18">Single-View Optical Elevation Extraction, Scale Calibration &amp; 3D Flythrough</text>

  <g transform="translate(40, 105)" filter="url(#lightShadow)">
    <rect width="180" height="325" rx="10" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="180" height="32" rx="10" fill="#eff6ff"/>
    <text x="90" y="21" fill="#2563eb" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">01. OPTICAL INPUT</text>
    
    <rect x="15" y="45" width="150" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="65" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">GeoTIFF Satellite</text>
    <text x="25" y="82" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Georeferenced / WGS84</text>
    <text x="25" y="94" fill="#0284c7" font-family="'JetBrains Mono', monospace" font-size="9">CRS &amp; GSD Metadata</text>

    <rect x="15" y="112" width="150" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="132" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">Standard RGB (JPG/PNG)</text>
    <text x="25" y="149" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Non-georeferenced</text>
    <text x="25" y="161" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Relative DSM Path</text>

    <rect x="15" y="179" width="150" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="199" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">GSD Normalization</text>
    <text x="25" y="216" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Scale-Standardization</text>
    <text x="25" y="229" fill="#2563eb" font-family="'JetBrains Mono', monospace" font-size="9">Bridges Sensor Gaps</text>

    <rect x="15" y="249" width="150" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="269" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">FastAPI Ingest Bridge</text>
    <text x="25" y="286" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Rasterio / GDAL Engine</text>
    <text x="25" y="299" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="9">POST /upload Endpoint</text>
  </g>

  <line x1="220" y1="268" x2="275" y2="268" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="3,3"/>

