<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="lightShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background with subtle blueprint grid -->
  <rect width="1000" height="480" fill="url(#bgGrad)"/>
  <g stroke="rgba(37, 99, 235, 0.06)" stroke-width="1">
    <line x1="0" y1="80" x2="1000" y2="80"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="0" y1="320" x2="1000" y2="320"/>
    <line x1="0" y1="400" x2="1000" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="800" y1="0" x2="800" y2="480"/>
  </g>

  <!-- Header Text -->
  <text x="40" y="45" fill="#2563eb" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2" font-weight="700">SYSTEM ARCHITECTURE PIPELINE</text>
  <text x="40" y="68" fill="#0f172a" font-family="Inter, sans-serif" font-weight="800" font-size="18">TRACEOIL Multi-Modal Oil Spill &amp; Vessel Attribution Flow</text>

  <!-- Phase 1: Ingestion -->
  <g transform="translate(40, 110)" filter="url(#lightShadow)">
    <rect width="160" height="310" rx="10" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="160" height="30" rx="10" fill="#eff6ff"/>
    <text x="80" y="20" fill="#2563eb" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">01. INGESTION</text>
    
    <rect x="15" y="45" width="130" height="52" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="65" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">Sentinel-1 SAR</text>
    <text x="25" y="82" fill="#64748b" font-family="Inter, sans-serif" font-size="10">C-Band GRD (VV/VH)</text>

    <rect x="15" y="110" width="130" height="52" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="130" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">Sentinel-2 Optical</text>
    <text x="25" y="147" fill="#64748b" font-family="Inter, sans-serif" font-size="10">MSI Multispectral BOA</text>

    <rect x="15" y="175" width="130" height="52" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="195" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">AIS Telemetry</text>
    <text x="25" y="212" fill="#64748b" font-family="Inter, sans-serif" font-size="10">NMEA 0183 Messages</text>

    <rect x="15" y="240" width="130" height="52" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="260" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">Ocean / MetOcean</text>
    <text x="25" y="277" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Copernicus Current &amp; Wind</text>
  </g>

  <!-- Connection 1 -> 2 -->
  <line x1="200" y1="265" x2="235" y2="265" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 2: Preprocessing -->
  <g transform="translate(240, 110)" filter="url(#lightShadow)">
    <rect width="160" height="310" rx="10" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="160" height="30" rx="10" fill="#eff6ff"/>
    <text x="80" y="20" fill="#2563eb" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">02. PREPROCESS</text>

    <rect x="15" y="45" width="130" height="52" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="65" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">Calibration</text>
    <text x="25" y="82" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Radiometric Sigma0</text>

    <rect x="15" y="110" width="130" height="52" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="130" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">Speckle Filter</text>
    <text x="25" y="147" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Refined Lee Filter</text>

    <rect x="15" y="175" width="130" height="52" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="195" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">Land Masking</text>
    <text x="25" y="212" fill="#64748b" font-family="Inter, sans-serif" font-size="10">GSHHG Coastlines</text>

    <rect x="15" y="240" width="130" height="52" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="260" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">AIS Cleaner</text>
    <text x="25" y="277" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Trajectory Interpolation</text>
  </g>

  <!-- Connection 2 -> 3 (Branching) -->
  <path d="M 400 190 L 435 170" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 400 320 L 435 340" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 3: Core Detection Engines -->
  <!-- Top: Spill Detection -->
  <g transform="translate(440, 110)" filter="url(#lightShadow)">
    <rect width="170" height="145" rx="10" fill="url(#boxGrad)" stroke="#93c5fd" stroke-width="1.5"/>
    <rect width="170" height="28" rx="10" fill="#eff6ff"/>
    <text x="85" y="19" fill="#0284c7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">03A. SPILL DETECTION</text>
    
    <text x="15" y="55" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">Dark Slick Segmentation</text>
    <text x="15" y="72" fill="#64748b" font-family="Inter, sans-serif" font-size="10">• Adaptive Thresholding</text>
    <text x="15" y="88" fill="#64748b" font-family="Inter, sans-serif" font-size="10">• Lookalike Damping Discrim.</text>
    <text x="15" y="104" fill="#64748b" font-family="Inter, sans-serif" font-size="10">• Geometric Shape Metrics</text>
    <text x="15" y="125" fill="#0284c7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Output: Slick Polygon</text>
  </g>

  <!-- Bottom: Vessel Detection -->
  <g transform="translate(440, 275)" filter="url(#lightShadow)">
    <rect width="170" height="145" rx="10" fill="url(#boxGrad)" stroke="#fed7aa" stroke-width="1.5"/>
    <rect width="170" height="28" rx="10" fill="#fff7ed"/>
    <text x="85" y="19" fill="#c2410c" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">03B. VESSEL DETECT</text>
    
    <text x="15" y="55" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">Bright Target Extraction</text>
    <text x="15" y="72" fill="#64748b" font-family="Inter, sans-serif" font-size="10">• Adaptive CFAR Detector</text>
    <text x="15" y="88" fill="#64748b" font-family="Inter, sans-serif" font-size="10">• Target Dimension Bounds</text>
    <text x="15" y="104" fill="#64748b" font-family="Inter, sans-serif" font-size="10">• AIS Correlation Match</text>
    <text x="15" y="125" fill="#c2410c" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">Output: Vessel Identity</text>
  </g>

  <!-- Connection 3 -> 4 -->
  <path d="M 610 180 L 645 230" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 610 350 L 645 290" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 4: Geospatial Drift & Attribution -->
  <g transform="translate(650, 110)" filter="url(#lightShadow)">
    <rect width="160" height="310" rx="10" fill="url(#boxGrad)" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect width="160" height="30" rx="10" fill="#ecfdf5"/>
    <text x="80" y="20" fill="#047857" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">04. ATTRIBUTION</text>

    <rect x="12" y="45" width="136" height="75" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="65" fill="#0f172a" font-family="Inter, sans-serif" font-size="11" font-weight="600">Reverse Drift Model</text>
    <text x="20" y="82" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Lagrangian particle backtrack</text>
    <text x="20" y="98" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Wind + Ocean current force</text>

    <rect x="12" y="130" width="136" height="75" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="150" fill="#0f172a" font-family="Inter, sans-serif" font-size="11" font-weight="600">Spatio-Temporal Match</text>
    <text x="20" y="167" fill="#64748b" font-family="Inter, sans-serif" font-size="10">AIS vessel track intersection</text>
    <text x="20" y="183" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Release time window corridor</text>

    <rect x="12" y="215" width="136" height="75" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="235" fill="#0f172a" font-family="Inter, sans-serif" font-size="11" font-weight="600">Confidence Scoring</text>
    <text x="20" y="252" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Multi-factor probability: P(V)</text>
    <text x="20" y="268" fill="#047857" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">Distance, Time, Kinematics</text>
  </g>

  <!-- Connection 4 -> 5 -->
  <line x1="810" y1="265" x2="835" y2="265" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 5: Report Generation -->
  <g transform="translate(840, 150)" filter="url(#lightShadow)">
    <rect width="125" height="230" rx="10" fill="url(#boxGrad)" stroke="#ddd6fe" stroke-width="1.5"/>
    <rect width="125" height="30" rx="10" fill="#f5f3ff"/>
    <text x="62" y="20" fill="#6d28d9" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">05. DOSSIER</text>

    <text x="12" y="60" fill="#0f172a" font-family="Inter, sans-serif" font-size="11" font-weight="600">Forensic Output</text>
    <text x="12" y="80" fill="#64748b" font-family="Inter, sans-serif" font-size="10">• Spill Footprint</text>
    <text x="12" y="98" fill="#64748b" font-family="Inter, sans-serif" font-size="10">• Vessel Identity</text>
    <text x="12" y="116" fill="#64748b" font-family="Inter, sans-serif" font-size="10">• MMSI / IMO #</text>
    <text x="12" y="134" fill="#64748b" font-family="Inter, sans-serif" font-size="10">• Attribution %</text>
    <text x="12" y="152" fill="#64748b" font-family="Inter, sans-serif" font-size="10">• GeoJSON / PDF</text>
    <text x="12" y="172" fill="#64748b" font-family="Inter, sans-serif" font-size="10">• Legal Evidentiary</text>

    <rect x="12" y="190" width="101" height="24" rx="4" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="62" y="206" fill="#6d28d9" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">VERIFIED</text>
  </g>
</svg>
