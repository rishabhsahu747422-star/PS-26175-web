    <text x="25" y="81" fill="#0f172a" font-family="Inter, sans-serif" font-size="11" font-weight="600">Per-Land-Cover Fitting</text>
    <text x="25" y="98" fill="#166534" font-family="'JetBrains Mono', monospace" font-size="9">Building: -44% | Tree: -35%</text>

    <rect x="15" y="121" width="175" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="141" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">SRTM 30m Anchoring</text>
    <text x="25" y="158" fill="#64748b" font-family="Inter, sans-serif" font-size="10">USGS / OpenTopography DEM</text>
    <text x="25" y="173" fill="#2563eb" font-family="'JetBrains Mono', monospace" font-size="9">Coarse Regional Trend</text>

    <rect x="15" y="195" width="175" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="215" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">Guided / Edge Filter</text>
    <text x="25" y="232" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Removes High-Freq Noise</text>
    <text x="25" y="244" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Clean 3D Surface</text>

    <rect x="15" y="265" width="175" height="50" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="285" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">16-bit Metric Heightmap</text>
    <text x="25" y="302" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="9">[0..65535] Linear Range</text>
  </g>

  <line x1="735" y1="268" x2="775" y2="268" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(780, 105)" filter="url(#lightShadow)">
    <rect width="180" height="325" rx="10" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="180" height="32" rx="10" fill="#faf5ff"/>
    <text x="90" y="21" fill="#7c3aed" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">04. 3D VISUALIZATION</text>

    <rect x="15" y="45" width="150" height="66" rx="6" fill="#ffffff" stroke="#e9d5ff"/>
    <text x="25" y="65" fill="#7c3aed" font-family="Inter, sans-serif" font-size="11" font-weight="700">&#x2605; INNOVATION #2</text>
    <text x="25" y="81" fill="#0f172a" font-family="Inter, sans-serif" font-size="11" font-weight="600">MC-Dropout Confidence</text>
    <text x="25" y="98" fill="#6b21a8" font-family="'JetBrains Mono', monospace" font-size="9">Uncertainty Heatmap</text>

    <rect x="15" y="121" width="150" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="141" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">Textured Mesh</text>
    <text x="25" y="158" fill="#64748b" font-family="Inter, sans-serif" font-size="10">UV RGB Map onto Plane</text>
    <text x="25" y="173" fill="#2563eb" font-family="'JetBrains Mono', monospace" font-size="9">GPU Vertex Displacement</text>

    <rect x="15" y="195" width="150" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="215" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">Camera Flythrough</text>
    <text x="25" y="232" fill="#64748b" font-family="Inter, sans-serif" font-size="10">First-Person + Orbit</text>
    <text x="25" y="244" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Three.js Engine</text>

    <rect x="15" y="265" width="150" height="50" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="285" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">Point &amp; Profile Tools</text>
    <text x="25" y="302" fill="#7c3aed" font-family="'JetBrains Mono', monospace" font-size="9">Elevation Cross-Section</text>
  </g>

  <g transform="translate(40, 445)">
    <circle cx="10" cy="10" r="5" fill="#2563eb"/>
    <text x="24" y="14" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Core Pipeline Flow</text>
    
    <circle cx="180" cy="10" r="5" fill="#059669"/>
    <text x="194" y="14" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Innovation #1: Per-Class Calibration</text>
    
    <circle cx="430" cy="10" r="5" fill="#7c3aed"/>
    <text x="444" y="14" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Innovation #2: Uncertainty Overlay</text>
    
    <rect x="680" y="5" width="12" height="10" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="700" y="14" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Offline Standalone Architecture</text>
  </g>
</svg>