    <text x="97" y="21" fill="#2563eb" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">02. ELEVATION EXTRACTION</text>

    <rect x="15" y="45" width="165" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="65" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">Depth Anything V2</text>
    <text x="25" y="82" fill="#64748b" font-family="Inter, sans-serif" font-size="10">ViT Monocular Backbone</text>
    <text x="25" y="96" fill="#2563eb" font-family="'JetBrains Mono', monospace" font-size="9">Pretrained on Natural Img</text>

    <rect x="15" y="119" width="165" height="68" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="139" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">GAMUS Fine-Tuning</text>
    <text x="25" y="156" fill="#64748b" font-family="Inter, sans-serif" font-size="10">11,507 Earthflow Paired Tiles</text>
    <text x="25" y="171" fill="#0284c7" font-family="'JetBrains Mono', monospace" font-size="9">Resolves Nadir Domain Gap</text>

    <rect x="15" y="197" width="165" height="58" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="217" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">Scale-Invariant Loss</text>
    <text x="25" y="234" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Multi-Scale Gradient Term</text>
    <text x="25" y="246" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Preserves Sharp Edges</text>

    <rect x="15" y="265" width="165" height="50" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="25" y="285" fill="#0f172a" font-family="Inter, sans-serif" font-size="12" font-weight="600">Relative Depth Map</text>
    <text x="25" y="302" fill="#2563eb" font-family="'JetBrains Mono', monospace" font-size="9">nDSM-like Structure</text>
  </g>

  <line x1="475" y1="268" x2="525" y2="268" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(530, 105)" filter="url(#lightShadow)">
    <rect width="205" height="325" rx="10" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
