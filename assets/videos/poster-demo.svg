<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#pGrad)"/>

  <!-- Background Technical Blueprint Grid -->
  <g stroke="rgba(37, 99, 235, 0.08)" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/><line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/><line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/><line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/><line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- 3D Viewport Window Frame -->
  <g transform="translate(140, 80)" filter="url(#pShadow)">
    <rect width="1000" height="560" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Title Bar -->
    <rect width="1000" height="46" rx="14" fill="#0f172a"/>
    <circle cx="25" cy="23" r="6" fill="#ef4444"/>
    <circle cx="45" cy="23" r="6" fill="#f59e0b"/>
    <circle cx="65" cy="23" r="6" fill="#10b981"/>
    <text x="500" y="28" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">DepthWizard &bull; 3D Terrain Flythrough &bull; Three.js Interactive Viewport</text>
    
    <!-- Viewport Interior -->
    <rect x="15" y="60" width="970" height="485" rx="8" fill="#090d16"/>
    <!-- Wireframe & 3D Terrain Horizon -->
    <path d="M 30 460 L 500 240 L 960 460 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 200 370 L 500 240 L 780 370 Z" fill="#064e3b" stroke="#34d399" stroke-width="1" opacity="0.7"/>
    <rect x="420" y="280" width="80" height="120" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="420,280 460,250 540,250 500,280" fill="#0284c7"/>
    <polygon points="500,280 540,250 540,370 500,400" fill="#0369a1"/>

    <!-- Central Play/Launch Badge -->
    <g transform="translate(500, 310)">
      <circle cx="0" cy="0" r="48" fill="#2563eb" filter="url(#pShadow)"/>
      <polygon points="-12,-20 22,0 -12,20" fill="#ffffff"/>
    </g>
    <text x="500" y="385" fill="#ffffff" font-family="Inter, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Interactive 3D Flythrough Demo</text>
    <text x="500" y="408" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Click to Explore Terrain Mesh, Elevation Profiles &amp; Confidence Heatmaps</text>
  </g>
</svg>